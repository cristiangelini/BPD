name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run GUT tests
        run: ~/godot/godot --headless --path . -s res://addons/gut/gut_cmdln.gd
