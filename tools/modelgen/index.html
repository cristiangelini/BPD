<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>modelgen</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Preview renderer close to the game: flat-shaded low poly, soft sky light, warm sun, ACES tonemap.
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// Every module in models/*.js exports models {glbName: buildFn} and views {name: spec}.
const builders = {};
window.loadModules = async (files) => {
	const views = {};
	for (const f of files) {
		const mod = await import(`./models/${f}`);
		Object.assign(builders, mod.models ?? {});
		Object.assign(views, mod.views ?? {});
	}
	return { views, models: Object.keys(builders) };
};
const cache = {};
const model = (name) => (cache[name] ??= builders[name]());

window.exportGlb = async (name) => {
	const scene = new THREE.Scene();
	scene.add(model(name));
	const buf = await new GLTFExporter().parseAsync(scene, { binary: true });
	let s = '';
	const bytes = new Uint8Array(buf);
	for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
	const box = new THREE.Box3().setFromObject(model(name));
	return { b64: btoa(s), triangles: model(name).userData.triangles, size: box.getSize(new THREE.Vector3()).toArray().map((v) => +v.toFixed(2)) };
};

const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// spec: {items:[{name, pos:[x,y,z], rotY}], cam:{pos, target, fov}, bg}
window.renderView = (spec) => {
	const scene = new THREE.Scene();
	scene.background = new THREE.Color(spec.bg ?? 0x8ec5e8);
	scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x8a7a66, 1.4));
	const sun = new THREE.DirectionalLight(0xffe6c4, 2.6);
	sun.position.set(4, 8, 6);
	sun.castShadow = true;
	sun.shadow.mapSize.set(2048, 2048);
	Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
	sun.shadow.normalBias = 0.02;
	scene.add(sun);
	const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: spec.floor ?? 0xd8c7a8, roughness: 1 }));
	floor.rotation.x = -Math.PI / 2;
	floor.receiveShadow = true;
	scene.add(floor);
	for (const it of spec.items) {
		const o = model(it.name).clone();
		o.position.set(...(it.pos ?? [0, 0, 0]));
		o.rotation.y = it.rotY ?? 0;
		o.traverse((m) => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
		scene.add(o);
	}
	const cam = new THREE.PerspectiveCamera(spec.cam.fov ?? 35, W / H, 0.05, 200);
	cam.position.set(...spec.cam.pos);
	cam.lookAt(...spec.cam.target);
	renderer.render(scene, cam);
	return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
